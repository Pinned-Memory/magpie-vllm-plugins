[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "magpie-vllm"
version = "0.1.0"
description = "Vortex per-KV-head block-sparse attention for vLLM (Qwen3.5 family)"
requires-python = ">=3.10"

[project.entry-points."vllm.general_plugins"]
magpie = "magpie_vllm.plugin:register"

[tool.setuptools.packages.find]
include = ["magpie_vllm*"]
